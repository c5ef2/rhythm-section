<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<!-- Brand-blue header strip in PWA / installed contexts. The body's
		     ::before pseudo paints the same gradient under the iOS status
		     bar to keep the look consistent. -->
		<meta name="theme-color" content="#6f8cff" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Rhythm Section" />
		<meta name="application-name" content="Rhythm Section" />
		<link rel="manifest" href="./manifest.webmanifest" />
		<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
