<!doctype html>
<html lang="en">

		<meta charset="utf-8" />

			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>

		<meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)" />
		<meta name="mobile-web-app-capable" content="yes" />
