<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<title>Rhythm Section</title>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#6f8cff" />
			<stop offset="1" stop-color="#8a6cff" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="14" ry="14" fill="url(#bg)" />
	<!-- Two beamed eighth notes -->
	<g fill="#ffffff" stroke="#ffffff" stroke-linecap="round">
		<!-- Left note head -->
		<ellipse cx="19" cy="42" rx="6.2" ry="4.4" transform="rotate(-18 19 42)" />
		<!-- Right note head -->
		<ellipse cx="43" cy="42" rx="6.2" ry="4.4" transform="rotate(-18 43 42)" />
		<!-- Stems -->
		<line x1="24.5" y1="40.3" x2="24.5" y2="14" stroke-width="2.4" />
		<line x1="48.5" y1="40.3" x2="48.5" y2="14" stroke-width="2.4" />
		<!-- Beam -->
		<rect x="24" y="12" width="25" height="4.5" rx="1" />
	</g>
	<!-- Accent dot — the "currently-playing" highlight, tiny orange pulse -->
	<circle cx="50" cy="48" r="4.5" fill="#ff8a3d" />
</svg>
